name: CI

# Runs all builds, checks, and tests on GitHub Actions (not locally).
# Adapted from the Tauri v2 CI/CD guide for Vuoom's pnpm + Cargo-workspace layout.

on:
  push:
    branches: [main, 'ui/**']
    paths-ignore:
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/pages.yml'

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt JS actions into Node 24 (Node 20 is being deprecated on the runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # whisper.cpp (captions) is built for a portable AVX2 baseline, not the runner's CPU.
  GGML_NATIVE: "OFF"

jobs:
  # The answer for a frontend change in about a minute, ahead of the long Windows job.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, build
        run: pnpm run typecheck && pnpm run lint && node scripts/check-i18n.mjs && pnpm run build

      - name: Report dist bundle sizes
        run: |
          node -e '
          const fs = require("fs"), path = require("path"), zlib = require("zlib");
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
          let raw = 0, gz = 0;
          for (const f of walk("dist")) { const b = fs.readFileSync(f); raw += b.length; gz += zlib.gzipSync(b, { level: 9 }).length; }
          console.log(`dist/ (standalone): ${raw} B (${(raw / 1024).toFixed(1)} KB) raw / ${gz} B (${(gz / 1024).toFixed(1)} KB) gzip`);
          '

  ci:
    runs-on: windows-latest # Windows build: WGC/DXGI capture, Media Foundation, wgpu DX12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend (tsc --noEmit)
        run: pnpm run typecheck

      - name: Lint frontend (Biome)
        run: pnpm run lint

      # Build the frontend FIRST: Tauri's generate_context! needs dist/ to exist
      # before cargo can check/compile the app crate.
      - name: Build frontend (vite -> dist/)
        run: pnpm run build

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build Windows preview executable (ui/**)
        if: startsWith(github.ref, 'refs/heads/ui/')
        shell: pwsh
        env:
          TAURI_ENV_PLATFORM: windows
          GGML_NATIVE: "OFF"
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "no_updater.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $cfg -Encoding utf8
          pnpm tauri build --no-bundle --config $cfg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('fs'),p=require('path'),z=require('zlib');const w=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?w(p.join(d,e.name)):[p.join(d,e.name)]);let r=0,g=0;for(const f of w('dist')){const b=fs.readFileSync(f);r+=b.length;g+=z.gzipSync(b,{level:9}).length;}const exe=fs.statSync('target/release/vuoom.exe').size;console.log('packaged dist/:',r,'B raw /',g,'B gz | vuoom.exe:',exe,'B');"

      - name: Upload Windows preview executable (ui/**)
        if: startsWith(github.ref, 'refs/heads/ui/')
        uses: actions/upload-artifact@v4
        with:
          name: vuoom-windows-x64
          path: target/release/vuoom.exe
          retention-days: 7
          if-no-files-found: error

  # ─── macOS build (Apple Silicon): ScreenCaptureKit, AVFoundation, wgpu Metal ─
  # The same checks as the Windows job, so neither platform's code can rot unseen. The
  # tests that need a screen or the GPU are #[ignore]d (run them by hand on a Mac, see
  # src-tauri/src/macos/e2e.rs).
  macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (vite -> dist/)
        run: pnpm run build

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  # ─── Dependency + license audit (cheap ubuntu runner) ─────────────────────
  # cargo-deny resolves the full dependency graph regardless of target, so it
  # runs fine on Linux even though Vuoom is Windows-only. Enforces the
  # Apache-2.0 / no-copyleft license posture (see deny.toml).
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
