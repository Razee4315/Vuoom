[package]
name = "vuoom-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Microphone and system-audio capture (WASAPI, QPC-aligned), WAV storage, and the edit-aware mixer used by preview and MP4 export."

[dependencies]
tracing.workspace = true
# RNNoise in pure Rust, for "Remove noise" (BSD-3-Clause). Without default features it is
# just the library: no CLI, no resampler, no training code.
nnnoiseless = { version = "0.5.2", default-features = false }

# WASAPI capture and endpoint enumeration. Pinned to the version the rest of the workspace
# uses (0.62) so no second `windows` tree is compiled.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

[dev-dependencies]
tempfile = "3"
vuoom-input.workspace = true

# macOS: microphones through Core Audio (cpal), system sound through ScreenCaptureKit's
# audio output (macOS 13+), both stamped on the host clock the frames use.
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.16"
vuoom-input.workspace = true
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSString"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime", "CMFormatDescription", "CMBlockBuffer", "CMBase", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "libc", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGDirectDisplay", "CGWindow"] }
