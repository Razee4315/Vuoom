[package]
name = "vuoom-camera"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Webcam capture (Media Foundation), JPEG frames through WIC, and the timestamped track preview and export read from."

[dependencies]
tracing.workspace = true

# Media Foundation for capture, WIC for JPEG. Pinned to the version the rest of the
# workspace uses (0.62) so no second `windows` tree is compiled.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
] }

[dev-dependencies]
tempfile = "3"
vuoom-input.workspace = true

# Elsewhere than Windows: JPEG in pure Rust (MIT/Apache/Zlib), webcam through AVFoundation.
[target.'cfg(not(windows))'.dependencies]
jpeg-encoder = "0.7"
zune-jpeg = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
vuoom-input.workspace = true
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSString", "NSDictionary", "NSValue"] }
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime", "CMFormatDescription", "CMBase", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-core-foundation = "0.3"
