[package]
name = "vuoom-camera"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Webcam capture (Media Foundation), JPEG frames through WIC, and the timestamped track preview and export read from."

[dependencies]
tracing.workspace = true

# Media Foundation for capture, WIC for JPEG. Pinned to the version the rest of the
# workspace uses (0.62) so no second `windows` tree is compiled.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
] }

[dev-dependencies]
tempfile = "3"
