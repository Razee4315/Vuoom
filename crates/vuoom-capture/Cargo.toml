[package]
name = "vuoom-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Windows screen capture (WGC via windows-capture; DXGI Desktop Duplication fallback) → BGRA frames."

[dependencies]
vuoom-input.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
# DXGI and D3D11 for Desktop Duplication (pointer shape, rotation, reading back only the
# changed rows). Pinned to the version windows-capture uses (0.62), which already builds these
# modules, so no second `windows` tree is compiled.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
