[package]
name = "vuoom-encode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GIF and animated WebP export: frame planning, size estimation, and pure-Rust/libwebp encoders (keeps Vuoom Apache-2.0)."

[dependencies]
thiserror.workspace = true
serde.workspace = true
png = "0.18"
# Pure-Rust animated-GIF encoder (MIT/Apache), linked — this is the shipping GIF encoder.
# See docs/06-Export.md. Default features are disabled to omit duplicate `color_quant 1.x`.
gif = { version = "0.13", default-features = false, features = ["std", "raii_no_panic"] }
# NeuQuant quantizer (MIT/Apache) — used directly to build ONE global palette for the whole
# clip so frames can be delta-encoded.
color_quant = "2.0"
# Google libwebp (BSD-3-Clause, bindings MIT), statically compiled from vendored C sources
# for animated WebP export without external binaries or copyleft dependencies.
libwebp-sys = "0.14"

[dev-dependencies]
tempfile = "3"
