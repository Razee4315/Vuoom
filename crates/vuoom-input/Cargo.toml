[package]
name = "vuoom-input"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Global input capture (Raw Input via windows-rs) → QPC-stamped event log that drives auto-zoom."

[dependencies]
vuoom-zoom.workspace = true
glam.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Quartz event tap, display geometry and the host clock (macOS).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFMachPort", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGDirectDisplay", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "CGError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSImage", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
